<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="100%" stop-color="#1a0f2e"/>
    </linearGradient>
    <linearGradient id="h-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
      <animate attributeName="x1" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="h-glow">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="h-blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1200" height="400" fill="url(#h-bg)"/>
  
  <!-- dot texture -->
  <g opacity="0.15">
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#22d3ee"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#dots)"/>
  </g>

  <!-- floating orbs (3D depth) -->
  <circle cx="200" cy="100" r="80" fill="url(#h-glow)" filter="url(#h-blur)">
    <animate attributeName="cy" values="100;140;100" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="300" r="100" fill="url(#h-glow)" filter="url(#h-blur)">
    <animate attributeName="cy" values="300;260;300" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- left: pill -->
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#0d0e16" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="24" fill="#22d3ee" font-family="monospace" font-size="14">Available for work</text>
  </g>

  <!-- typed greeting -->
  <text x="80" y="160" fill="#a78bfa" font-family="monospace" font-size="20">
    &gt; Hi there, I am
  </text>

  <!-- animated name -->
  <text x="80" y="240" fill="url(#h-name)" font-family="Arial Black, sans-serif" font-size="72" font-weight="900">
    Paynexus
  </text>

  <!-- cycling roles -->
  <g>
    <text x="80" y="290" fill="#e5e7eb" font-family="monospace" font-size="22">
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;0" dur="16s" repeatCount="indefinite" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;1"/>
      💳 Payment Gateway Expert
    </text>
    <text x="80" y="290" fill="#e5e7eb" font-family="monospace" font-size="22">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" dur="16s" repeatCount="indefinite" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;1"/>
      💬 WhatsApp API Integrator
    </text>
    <text x="80" y="290" fill="#e5e7eb" font-family="monospace" font-size="22">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" dur="16s" repeatCount="indefinite" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;1"/>
      🏛️ RTPS Portal Builder
    </text>
    <text x="80" y="290" fill="#e5e7eb" font-family="monospace" font-size="22">
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1" dur="16s" repeatCount="indefinite" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;1"/>
      🔐 OTP Systems Expert
    </text>
  </g>

  <!-- meta row -->
  <g transform="translate(80,330)" font-family="monospace" font-size="14" fill="#6b7280">
    <text x="0" y="0">📍 India</text>
    <text x="120" y="0">🏢 PayNexus Agency</text>
    <text x="320" y="0">⭐ 500+ Projects</text>
  </g>

  <!-- right: glowing 3D core -->
  <g transform="translate(950,200)">
    <circle r="100" fill="url(#h-glow)" filter="url(#h-blur)">
      <animate attributeName="r" values="100;120;100" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="60" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="80" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="40" fill="#0d0e16" stroke="#f472b6" stroke-width="2"/>
    <text x="0" y="8" fill="#22d3ee" font-family="monospace" font-size="24" text-anchor="middle" font-weight="bold">₹</text>
  </g>

  <!-- REC indicator -->
  <g transform="translate(1100,40)">
    <circle cx="0" cy="0" r="6" fill="#f472b6">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="5" fill="#f472b6" font-family="monospace" font-size="12">REC</text>
  </g>
</svg>
