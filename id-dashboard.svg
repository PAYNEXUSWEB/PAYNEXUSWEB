<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="500">
  <defs>
    <linearGradient id="id-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="100%" stop-color="#1a0f2e"/>
    </linearGradient>
    <linearGradient id="id-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="id-foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;2" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;3" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#id-bg)"/>

  <!-- Lanyard strap -->
  <rect x="230" y="0" width="40" height="80" fill="#1a0f2e" stroke="#22d3ee" stroke-width="1"/>
  <text x="250" y="50" fill="#22d3ee" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(-90 250 50)">PAYNEXUS</text>

  <!-- ID Card (swinging) -->
  <g transform="translate(250,80)">
    <animateTransform attributeName="transform" type="rotate" values="0 0 0;3 0 0;-3 0 0;0 0 0" dur="4s" repeatCount="indefinite" additive="sum"/>
    <animateTransform attributeName="transform" type="translate" values="250 80;250 80;250 80" dur="4s" repeatCount="indefinite" additive="sum"/>

    <rect x="0" y="0" width="220" height="320" rx="16" fill="#0d0e16" stroke="url(#id-card)" stroke-width="2"/>

    <!-- Photo frame -->
    <rect x="20" y="40" width="180" height="140" rx="8" fill="#1a0f2e" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="110" cy="110" r="40" fill="#22d3ee" opacity="0.3"/>
    <text x="110" y="120" fill="#22d3ee" font-family="monospace" font-size="32" text-anchor="middle">👤</text>

    <!-- Name -->
    <text x="110" y="215" fill="#e5e7eb" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">PAYNEXUS</text>
    <text x="110" y="235" fill="#6b7280" font-family="monospace" font-size="11" text-anchor="middle">Web Developer</text>

    <!-- Chip -->
    <rect x="20" y="255" width="40" height="30" rx="4" fill="#fbbf24"/>
    <line x1="20" y1="265" x2="60" y2="265" stroke="#0d0e16" stroke-width="1"/>
    <line x1="20" y1="275" x2="60" y2="275" stroke="#0d0e16" stroke-width="1"/>
    <line x1="30" y1="255" x2="30" y2="285" stroke="#0d0e16" stroke-width="1"/>
    <line x1="45" y1="255" x2="45" y2="285" stroke="#0d0e16" stroke-width="1"/>

    <!-- Barcode -->
    <g transform="translate(80,255)" fill="#e5e7eb">
      <rect x="0" y="0" width="2" height="30"/>
      <rect x="4" y="0" width="1" height="30"/>
      <rect x="7" y="0" width="3" height="30"/>
      <rect x="12" y="0" width="1" height="30"/>
      <rect x="15" y="0" width="2" height="30"/>
      <rect x="19" y="0" width="3" height="30"/>
      <rect x="24" y="0" width="1" height="30"/>
      <rect x="27" y="0" width="2" height="30"/>
      <rect x="31" y="0" width="3" height="30"/>
      <rect x="36" y="0" width="1" height="30"/>
      <rect x="39" y="0" width="2" height="30"/>
      <rect x="43" y="0" width="3" height="30"/>
      <rect x="48" y="0" width="1" height="30"/>
    </g>

    <!-- Holographic sweep -->
    <rect x="0" y="0" width="220" height="320" rx="16" fill="url(#id-foil)"/>
  </g>

  <!-- DASHBOARD -->
  <g transform="translate(560,80)">
    <!-- KPI tiles -->
    <g>
      <rect x="0" y="0" width="140" height="90" rx="10" fill="#0d0e16" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="70" y="40" fill="#22d3ee" font-family="monospace" font-size="28" text-anchor="middle" font-weight="bold">500+</text>
      <text x="70" y="65" fill="#6b7280" font-family="monospace" font-size="11" text-anchor="middle">Projects</text>

      <rect x="155" y="0" width="140" height="90" rx="10" fill="#0d0e16" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="225" y="40" fill="#a78bfa" font-family="monospace" font-size="28" text-anchor="middle" font-weight="bold">900+</text>
      <text x="225" y="65" fill="#6b7280" font-family="monospace" font-size="11" text-anchor="middle">Users</text>

      <rect x="310" y="0" width="140" height="90" rx="10" fill="#0d0e16" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="380" y="40" fill="#fbbf24" font-family="monospace" font-size="28" text-anchor="middle" font-weight="bold">4.9★</text>
      <text x="380" y="65" fill="#6b7280" font-family="monospace" font-size="11" text-anchor="middle">Rating</text>

      <rect x="465" y="0" width="140" height="90" rx="10" fill="#0d0e16" stroke="#f472b6" stroke-width="1.5"/>
      <text x="535" y="40" fill="#f472b6" font-family="monospace" font-size="28" text-anchor="middle" font-weight="bold">15</text>
      <text x="535" y="65" fill="#6b7280" font-family="monospace" font-size="11" text-anchor="middle">Day Support</text>
    </g>

    <!-- Bar chart -->
    <g transform="translate(0,110)">
      <rect x="0" y="0" width="605" height="180" rx="10" fill="#0d0e16" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
      <text x="15" y="25" fill="#22d3ee" font-family="monospace" font-size="13">Top Services</text>

      <g transform="translate(20,50)">
        <text x="0" y="12" fill="#6b7280" font-family="monospace" font-size="10">RTPS</text>
        <rect x="60" y="0" width="0" height="16" fill="#22d3ee">
          <animate attributeName="width" values="0;500;500" dur="2s" fill="freeze"/>
        </rect>
        <text x="570" y="12" fill="#22d3ee" font-family="monospace" font-size="10" text-anchor="end">250</text>
      </g>
      <g transform="translate(20,75)">
        <text x="0" y="12" fill="#6b7280" font-family="monospace" font-size="10">Gateway</text>
        <rect x="60" y="0" width="0" height="16" fill="#a78bfa">
          <animate attributeName="width" values="0;420;420" dur="2s" begin="0.2s" fill="freeze"/>
        </rect>
        <text x="490" y="12" fill="#a78bfa" font-family="monospace" font-size="10" text-anchor="end">210</text>
      </g>
      <g transform="translate(20,100)">
        <text x="0" y="12" fill="#6b7280" font-family="monospace" font-size="10">WhatsApp</text>
        <rect x="60" y="0" width="0" height="16" fill="#34d399">
          <animate attributeName="width" values="0;340;340" dur="2s" begin="0.4s" fill="freeze"/>
        </rect>
        <text x="410" y="12" fill="#34d399" font-family="monospace" font-size="10" text-anchor="end">170</text>
      </g>
      <g transform="translate(20,125)">
        <text x="0" y="12" fill="#6b7280" font-family="monospace" font-size="10">OTP</text>
        <rect x="60" y="0" width="0" height="16" fill="#f472b6">
          <animate attributeName="width" values="0;280;280" dur="2s" begin="0.6s" fill="freeze"/>
        </rect>
        <text x="350" y="12" fill="#f472b6" font-family="monospace" font-size="10" text-anchor="end">140</text>
      </g>
      <g transform="translate(20,150)">
        <text x="0" y="12" fill="#6b7280" font-family="monospace" font-size="10">Print</text>
        <rect x="60" y="0" width="0" height="16" fill="#fbbf24">
          <animate attributeName="width" values="0;220;220" dur="2s" begin="0.8s" fill="freeze"/>
        </rect>
        <text x="290" y="12" fill="#fbbf24" font-family="monospace" font-size="10" text-anchor="end">110</text>
      </g>
    </g>
  </g>
</svg>
