<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="500">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="100%" stop-color="#0f1420"/>
    </linearGradient>
    <radialGradient id="s-core">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#s-bg)"/>

  <text x="600" y="50" fill="#22d3ee" font-family="monospace" font-size="24" text-anchor="middle" font-weight="bold">⚡ TECH STACK</text>

  <!-- core glow -->
  <circle cx="600" cy="280" r="120" fill="url(#s-core)">
    <animate attributeName="r" values="120;140;120" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbit 1 (Payments) — tilted ellipse -->
  <g transform="translate(600,280)">
    <ellipse rx="280" ry="80" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.3" transform="rotate(-15)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <g transform="translate(280,0) rotate(-15)">
        <circle r="20" fill="#0d0e16" stroke="#22d3ee" stroke-width="2"/>
        <text y="5" fill="#22d3ee" font-family="monospace" font-size="11" text-anchor="middle">Rzp</text>
      </g>
      <g transform="translate(-280,0) rotate(-15)">
        <circle r="20" fill="#0d0e16" stroke="#22d3ee" stroke-width="2"/>
        <text y="5" fill="#22d3ee" font-family="monospace" font-size="11" text-anchor="middle">PayU</text>
      </g>
      <g transform="translate(0,80) rotate(-15)">
        <circle r="20" fill="#0d0e16" stroke="#22d3ee" stroke-width="2"/>
        <text y="5" fill="#22d3ee" font-family="monospace" font-size="11" text-anchor="middle">PP</text>
      </g>
    </g>
  </g>

  <!-- Orbit 2 (Web Stack) — opposite direction -->
  <g transform="translate(600,280)">
    <ellipse rx="380" ry="110" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.3" transform="rotate(15)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      <g transform="translate(380,0) rotate(15)">
        <circle r="22" fill="#0d0e16" stroke="#a78bfa" stroke-width="2"/>
        <text y="5" fill="#a78bfa" font-family="monospace" font-size="10" text-anchor="middle">React</text>
      </g>
      <g transform="translate(-380,0) rotate(15)">
        <circle r="22" fill="#0d0e16" stroke="#a78bfa" stroke-width="2"/>
        <text y="5" fill="#a78bfa" font-family="monospace" font-size="10" text-anchor="middle">Node</text>
      </g>
      <g transform="translate(0,110) rotate(15)">
        <circle r="22" fill="#0d0e16" stroke="#a78bfa" stroke-width="2"/>
        <text y="5" fill="#a78bfa" font-family="monospace" font-size="10" text-anchor="middle">PHP</text>
      </g>
    </g>
  </g>

  <!-- Core -->
  <circle cx="600" cy="280" r="50" fill="#0d0e16" stroke="#f472b6" stroke-width="2"/>
  <text x="600" y="288" fill="#f472b6" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">PAY</text>

  <!-- Chip grid below -->
  <g transform="translate(100,450)" font-family="monospace" font-size="13">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#0d0e16" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="60" y="20" fill="#22d3ee" text-anchor="middle">Payments</text>

    <rect x="140" y="0" width="120" height="30" rx="15" fill="#0d0e16" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="200" y="20" fill="#a78bfa" text-anchor="middle">Messaging</text>

    <rect x="280" y="0" width="140" height="30" rx="15" fill="#0d0e16" stroke="#f472b6" stroke-width="1.5"/>
    <text x="350" y="20" fill="#f472b6" text-anchor="middle">Government</text>

    <rect x="440" y="0" width="120" height="30" rx="15" fill="#0d0e16" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="500" y="20" fill="#fbbf24" text-anchor="middle">Web</text>

    <rect x="580" y="0" width="120" height="30" rx="15" fill="#0d0e16" stroke="#34d399" stroke-width="1.5"/>
    <text x="640" y="20" fill="#34d399" text-anchor="middle">Wallet</text>
  </g>
</svg>
